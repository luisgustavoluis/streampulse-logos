name: Regenerar logos.json

on:
  push:
    branches: [main]
    paths: ["logos/**", "aliases.json", "sources.json", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar índice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build_index.py
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- logos.json; then echo "logos.json sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos.json
          git commit -m "chore: regenerar logos.json"
          git push
